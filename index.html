<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kod Blok – Belajar Coding Sambil Bermain</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <h1>🧩 Kod Blok</h1>
    <div class="right"><div id="hud" class="hud"></div><button id="mute" class="btn ghost" aria-label="Bunyi">🔊</button></div>
  </header>

  <main>
    <!-- Pilihan level -->
    <section id="menu" class="screen">
      <p class="sub">Susun blok arahan untuk membawa robot ke bendera 🏁. Pilih level untuk mula!</p>
      <div id="levels" class="levels"></div>
      <button id="reset-all" class="btn ghost small">Set semula kemajuan</button>
    </section>

    <!-- Permainan -->
    <section id="game" class="screen hidden">
      <div class="bar">
        <button id="back" class="btn ghost">☰ Level</button>
        <strong id="title"></strong>
        <span id="stars" class="chip"></span>
      </div>
      <div class="play">
        <div class="stage">
          <div id="board" class="board"></div>
          <p id="msg" class="msg"></p>
        </div>
        <div class="panel">
          <div class="lab">Atur cara <span id="count" class="chip"></span></div>
          <div id="prog" class="prog"></div>
          <div class="lab">Blok arahan</div>
          <div id="pal" class="pal"></div>
          <div class="ctl">
            <button id="run" class="btn go">▶ Jalankan</button>
            <button id="undo" class="btn">↩ Undur</button>
            <button id="clear" class="btn">🗑 Kosongkan</button>
            <button id="hint" class="btn">💡 Petunjuk</button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="modal" class="modal hidden">
    <div class="card">
      <div id="m-emoji" class="m-emoji">🎉</div>
      <h2 id="m-title"></h2>
      <div id="m-stars" class="m-stars"></div>
      <div class="ctl">
        <button id="m-replay" class="btn">🔁 Main semula</button>
        <button id="m-next" class="btn go">Seterusnya ➜</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
